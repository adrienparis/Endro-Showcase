name: Deploy to Github Pages

on:
  push:
    branches: [ master ]
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build and upload Site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployement.outputs.page_url }}
    steps:
      - name: Deploy Github Pages
        id: deployement
        uses: action/deploy-pages@v4